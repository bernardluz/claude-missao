<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel das missões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --fundo: #0d1015; --barra: #10141a; --cartao: #141920; --cartao-2: #10141a; --linha: #1f252e; --linha-2: #1a2029;
  --texto: #e7ebf1; --texto-2: #c3cad4; --suave: #9aa4b2; --apagado: #5d6776;
  --verde: #3fb27f; --verde-t: #8fe0b8; --verde-f: #1d3a2d; --verde-b: #2a5a43;
  --azul: #8fb4ff; --azul-t: #b8cfff; --azul-f: #1b2a47; --azul-b: #2f5fbf; --agora-f: #121a28; --agora-b: #25406f;
  --ambar: #e0a93b; --ambar-t: #f0c56a; --ambar-f: #3a2e12; --vermelho: #f06a6a; --vermelho-f: #3a1c1e;
  --mono: 'Geist Mono', ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 14px/1.45 Geist, system-ui, -apple-system, 'Segoe UI', sans-serif; }
button { font: inherit; color: inherit; }
a { color: var(--azul); }
.mono { font-family: var(--mono); font-size: 12px; }
.suave { color: var(--suave); }

header { position: sticky; top: 0; z-index: 5; height: 64px; display: flex; align-items: center; gap: 28px; padding: 0 28px; background: var(--barra); border-bottom: 1px solid var(--linha); }
.marca { display: flex; align-items: center; gap: 10px; width: 220px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.pulso { width: 10px; height: 10px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 0 4px rgba(63,178,127,.18); }
.pulso.erro { background: var(--vermelho); box-shadow: 0 0 0 4px rgba(240,106,106,.18); }
.limites { display: flex; gap: 28px; flex-grow: 1; align-items: center; min-width: 0; }
.limite { display: flex; align-items: center; gap: 12px; }
.limite .rot { display: flex; flex-direction: column; font-size: 12px; color: var(--suave); width: 112px; line-height: 1.3; }
.medidor { width: 150px; height: 8px; border-radius: 999px; background: var(--linha); overflow: hidden; }
.medidor > div { height: 100%; border-radius: 999px; background: var(--verde); }
.medidor.alerta > div { background: var(--ambar); } .medidor.critico > div { background: var(--vermelho); }
.limite b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; width: 52px; }
.atualizado { font-size: 12px; color: var(--suave); white-space: nowrap; }

.corpo { display: flex; min-height: calc(100vh - 64px); }
nav.missoes { width: 250px; flex-shrink: 0; padding: 22px 14px; border-right: 1px solid var(--linha); display: flex; flex-direction: column; gap: 8px; }
.grupo { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); padding: 12px 8px 2px; }
.missao { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 12px; background: transparent; border: 1px solid transparent; }
.missao:hover { background: var(--cartao); }
.missao.ativa { background: var(--cartao); border-color: var(--azul-b); }
.missao .topo { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.missao .sub { font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fina { height: 4px; border-radius: 999px; background: var(--linha); overflow: hidden; } .fina > div { height: 100%; background: var(--verde); }

main { flex-grow: 1; min-width: 0; padding: 26px 30px 40px; display: flex; flex-direction: column; gap: 18px; }
.vazio { color: var(--suave); padding: 60px; text-align: center; }
.hero { display: flex; align-items: flex-end; gap: 32px; flex-wrap: wrap; }
.hero .esq { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 280px; }
.titulo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.titulo h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.grande { font-size: 46px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.grande span { color: var(--apagado); }
.metricas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; flex-basis: 700px; flex-grow: 1; max-width: 760px; }
.metrica { padding: 13px 15px; border-radius: 12px; background: var(--cartao); border: 1px solid var(--linha); }
.metrica .v { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.metrica .r { font-size: 12px; color: var(--suave); }

.selo { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.selo .p { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-rodando, .s-agora, .s-validando, .s-corrigindo { background: var(--azul-f); color: var(--azul); }
.s-concluida, .s-validado, .s-feita, .s-ok, .s-aprovado { background: var(--verde-f); color: var(--verde-t); }
.s-parada, .s-parou, .s-caiu, .s-interrompido, .s-reprovado { background: var(--vermelho-f); color: var(--vermelho); }
.s-pendente, .s-pulada { background: var(--cartao); color: var(--suave); border: 1px solid var(--linha); }

.trilha { display: flex; gap: 6px; height: 38px; }
.trilha > div { flex-basis: 0; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 11px; font-size: 12px; min-width: 0; }
.trilha b { font-size: 13px; }
.t-validado { background: var(--verde-f); border: 1px solid var(--verde-b); color: var(--verde-t); }
.t-andamento { background: var(--azul-f); border: 1px solid var(--azul-b); color: var(--azul-t); }
.t-parou { background: var(--vermelho-f); border: 1px solid #6a2e31; color: var(--vermelho); }
.t-pendente { background: var(--cartao); border: 1px solid #2a313c; color: var(--suave); }
.legenda { display: flex; gap: 18px; font-size: 12px; color: var(--suave); margin-top: 8px; }
.legenda span { display: flex; align-items: center; gap: 6px; } .legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.grade { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 18px; align-items: start; }
@media (max-width: 1180px) { .grade { grid-template-columns: 1fr; } nav.missoes { width: 210px; } .limite .rot { width: 90px; } }
@media (max-width: 860px) { nav.missoes { display: none; } header { height: auto; flex-wrap: wrap; padding: 12px 16px; } main { padding: 16px; } .metricas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.cartao { border-radius: 14px; background: var(--cartao); border: 1px solid var(--linha); }
.cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--linha); }
.cab h2 { margin: 0; font-size: 15px; font-weight: 600; }
.rotulo { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

.agora { padding: 18px 20px; border-radius: 14px; background: var(--agora-f); border: 1px solid var(--agora-b); display: flex; flex-direction: column; gap: 14px; }
.agora.parada { background: var(--vermelho-f); border-color: #6a2e31; }
.agora.concluida { background: var(--verde-f); border-color: var(--verde-b); }
.agora .linha { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.agora .nome { font-size: 19px; font-weight: 600; }
.etapas { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.etapas li { padding: 9px 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 1px; font-size: 13px; font-weight: 600; }
.etapas li span { font-size: 12px; font-weight: 400; color: var(--suave); }
.e-feita { background: var(--verde-f); border: 1px solid var(--verde-b); color: var(--verde-t); }
.e-agora { background: var(--azul-f); border: 1px solid var(--azul-b); color: var(--azul-t); }
.e-parou { background: var(--vermelho-f); border: 1px solid #6a2e31; color: var(--vermelho); }
.e-pendente, .e-pulada { background: var(--cartao-2); border: 1px solid #2a313c; color: var(--suave); }

.vivo .quem { min-width: 0; display: flex; flex-direction: column; }
.vivo .quem b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.botao { cursor: pointer; padding: 6px 12px; border-radius: 8px; background: var(--cartao-2); border: 1px solid var(--linha); font-size: 12px; white-space: nowrap; }
.botao:hover { border-color: var(--azul-b); }
.botao.on { background: var(--azul-f); border-color: var(--azul-b); color: var(--azul-t); }
.feed { height: 480px; overflow-y: auto; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.passo { display: flex; gap: 10px; align-items: flex-start; }
.passo .ic { width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; display: grid; place-items: center; background: var(--cartao-2); border: 1px solid var(--linha); color: var(--suave); }
.passo .ic svg { width: 14px; height: 14px; }
.passo .cont { flex-grow: 1; min-width: 0; }
.passo .lin { display: flex; gap: 8px; align-items: baseline; }
.passo .res { flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.passo .h { font-size: 11px; color: var(--apagado); flex-shrink: 0; }
.passo details > summary { cursor: pointer; list-style: none; }
.passo details > summary::-webkit-details-marker { display: none; }
.passo pre { margin: 6px 0 2px; padding: 8px 10px; border-radius: 8px; background: var(--cartao-2); border: 1px solid var(--linha-2); white-space: pre-wrap; word-break: break-word; font: 12px/1.5 var(--mono); color: var(--texto-2); max-height: 320px; overflow: auto; }
.passo .saida { font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.passo .saida.erro { color: var(--vermelho); }
.passo.texto .cont { padding: 8px 12px; border-radius: 10px; background: var(--agora-f); border: 1px solid var(--agora-b); white-space: pre-wrap; word-break: break-word; }
.passo.pensou { color: var(--apagado); font-size: 12px; padding-left: 36px; }
.i-bash { color: var(--azul); } .i-edit { color: var(--ambar); } .i-read { color: var(--suave); } .i-busca { color: #b99bff; } .i-fim { color: var(--verde); }

.feat { border-bottom: 1px solid var(--linha-2); }
.feat:last-child { border-bottom: 0; }
.feat > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 11px 18px; }
.feat > summary::-webkit-details-marker { display: none; }
.feat > summary:hover { background: #161c24; }
.feat .t { flex-grow: 1; min-width: 0; }
.feat .meta { font-size: 12px; color: var(--suave); white-space: nowrap; }
.feat .sha { width: 72px; text-align: right; color: var(--azul); }
.feat .dentro { margin: 0 18px 14px 48px; padding: 12px 14px; border-radius: 10px; background: var(--cartao-2); display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--texto-2); }
.feat .dentro pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
.apont { display: flex; gap: 10px; }
.apont .tag { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; height: 18px; background: var(--ambar-f); color: var(--ambar-t); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { cursor: pointer; padding: 4px 10px; border-radius: 999px; font-size: 12px; background: var(--cartao); border: 1px solid var(--linha); }
.chip:hover, .chip.on { border-color: var(--azul-b); color: var(--azul-t); }
.ms > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--linha-2); }
.ms > summary::-webkit-details-marker { display: none; }
.ms > summary .t { flex-grow: 1; min-width: 0; font-size: 13px; color: var(--texto-2); }
.ms[open] > summary .t { color: var(--texto); font-weight: 600; }
.ico { width: 18px; height: 18px; flex-shrink: 0; }
.gira { animation: gira 1.1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.probs { padding: 10px 18px 14px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--linha-2); }

.ativ { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 2px; }
.ativ button { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; padding: 6px 4px; border-radius: 8px; cursor: pointer; }
.ativ button:hover { background: #161c24; }
.ativ .ponto { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.ativ .txt { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; }
.ativ .txt b { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ativ .txt span { font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ativ .qdo { font-size: 12px; color: var(--suave); flex-shrink: 0; }
.commits { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
.commits div { display: flex; gap: 10px; font-size: 13px; }
.commits div span:last-child { color: var(--texto-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.bloco > summary { list-style: none; cursor: pointer; }
details.bloco > summary::-webkit-details-marker { display: none; }
.skill { padding: 10px 16px; border-top: 1px solid var(--linha-2); }
.skill pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.5 var(--mono); color: var(--texto-2); margin: 6px 0 0; }
</style>
</head>
<body>
<header>
  <div class="marca"><span class="pulso" id="pulso"></span>Missões</div>
  <div class="limites" id="limites" aria-label="Limites da assinatura"></div>
  <span class="atualizado" id="atualizado">carregando…</span>
</header>
<div class="corpo">
  <nav class="missoes" id="lista" aria-label="Missões"></nav>
  <main id="detalhe"><div class="vazio">Nenhuma missão encontrada ainda.</div></main>
</div>
<script>
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const num = v => (Number.isFinite(Number(v)) ? Number(v) : 0)
const NOMES = { rodando: 'rodando', concluida: 'concluída', parada: 'parada', validado: 'validado', validando: 'validando', corrigindo: 'corrigindo', pendente: 'pendente', parou: 'parou', feita: 'feita', aprovado: 'aprovado', reprovado: 'reprovado', interrompido: 'interrompido', caiu: 'caiu', ok: 'ok', agora: 'agora', pulada: 'pulada' }
const CLASSES = new Set(Object.keys(NOMES))
const selo = (e, texto) => `<span class="selo s-${CLASSES.has(e) ? e : 'pendente'}"><span class="p"></span>${esc(texto ?? NOMES[e] ?? e)}</span>`
const duracao = ms => { if (!ms || ms < 0) return '—'; const m = Math.round(ms / 60000); return m < 1 ? '< 1 min' : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min` }
const ha = t => { const s = Math.round((Date.now() - num(typeof t === 'string' ? Date.parse(t) : t)) / 1000); return s < 60 ? `${Math.max(s, 0)} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h` }
const hora = t => t ? new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : ''
const quando = t => t ? new Date(t).toLocaleString('pt-BR', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : '—'
const tokens = v => { const n = num(v); return n >= 1e6 ? `${(n / 1e6).toFixed(1).replace('.', ',')} M` : n >= 1e3 ? `${Math.round(n / 1e3)} k` : String(n) }
const curto = t => String(t ?? '').replace(/^(F\d+|M\d+|correção [\d.]+)\s/, '$1 · ')

const SVG = {
  feita: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#3fb27f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="feita"><path d="M20 6 9 17l-5-5"/></svg>',
  rodando: '<svg class="ico gira" viewBox="0 0 24 24" fill="none" stroke="#8fb4ff" stroke-width="2.5" stroke-linecap="round" aria-label="rodando"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>',
  parou: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#f06a6a" stroke-width="2.5" stroke-linecap="round" aria-label="parou"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
  pendente: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#5d6776" stroke-width="2" aria-label="pendente"><circle cx="12" cy="12" r="8"/></svg>',
  bash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-5-6-5M12 19h8"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  read: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>',
  busca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  fim: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  outro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  tarefa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
}
const tipoIcone = n => ['Bash', 'PowerShell'].includes(n) ? ['bash', 'i-bash'] : ['Edit', 'Write', 'NotebookEdit'].includes(n) ? ['edit', 'i-edit']
  : n === 'Read' ? ['read', 'i-read'] : ['Grep', 'Glob'].includes(n) ? ['busca', 'i-busca'] : n === 'StructuredOutput' ? ['fim', 'i-fim'] : ['outro', '']

let selecionada = location.hash.slice(1) || null
let missaoAtual = null
const abertos = new Set((() => { try { return JSON.parse(sessionStorage.getItem('abertos') ?? '[]') } catch { return [] } })())
const lembrar = () => { try { sessionStorage.setItem('abertos', JSON.stringify([...abertos])) } catch {} }
document.addEventListener('toggle', e => {
  const id = e.target.dataset?.id
  if (!id || !e.isTrusted) return
  if (id.startsWith('p:')) { e.target.open ? abertosFeed.add(id) : abertosFeed.delete(id); return }
  if (e.target.open) { abertos.add(id); abertos.delete(`fechado:${id}`) } else { abertos.delete(id); if (e.target.dataset.padrao) abertos.add(`fechado:${id}`) }
  lembrar()
}, true)
const abertosFeed = new Set()
const aberto = (id, padrao = false) => abertosFeed.has(id) || abertos.has(id) || (padrao && !abertos.has(`fechado:${id}`))

// ---------- limites ----------
function renderLimites(l) {
  if (!l) { $('#limites').innerHTML = '<span class="suave" style="font-size:12px">Limites: aguardando a primeira leitura</span>'; return }
  const zera = ms => { if (!ms) return ''; const d = new Date(num(ms)); return new Date().toDateString() === d.toDateString() ? `hoje ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : d.toLocaleString('pt-BR', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) }
  const barra = (nome, j) => {
    if (!j) return ''
    const u = Math.max(0, Math.min(100, num(j.usado)))
    const c = u >= 95 ? 'critico' : u >= 80 ? 'alerta' : ''
    return `<div class="limite"><div class="rot"><span>${esc(nome)}</span><span>zera ${esc(zera(j.zeraEm))}</span></div><div class="medidor ${c}"><div style="width:${u}%"></div></div><b>${Math.round(u)}%</b></div>`
  }
  const velho = Date.now() - num(l.lidoEm) > 30 * 60 * 1000
  $('#limites').innerHTML = barra('Janela de 5 h', l.cincoHoras) + barra('Semanal', l.semanal) +
    (velho ? `<span class="suave" style="font-size:12px">leitura de ${esc(ha(num(l.lidoEm)))} atrás</span>` : '')
}

// ---------- lista ----------
function renderLista(ms) {
  const item = m => {
    const pct = m.progresso.total ? Math.round(100 * m.progresso.feitas / m.progresso.total) : 0
    return `<button class="missao ${m.id === selecionada ? 'ativa' : ''}" data-missao="${esc(m.id)}">
      <span class="topo"><span>${esc(m.projeto)}</span><span class="suave" style="font-size:12px">${num(m.progresso.feitas)}/${num(m.progresso.total)}</span></span>
      <span class="sub">${esc(m.milestoneAtual ?? (m.estado === 'concluida' ? 'concluída' : 'parada'))} · ${esc(quando(m.inicio))}</span>
      <span class="fina"><div style="width:${pct}%"></div></span></button>`
  }
  const ativas = ms.filter(m => m.estado === 'rodando'), outras = ms.filter(m => m.estado !== 'rodando')
  $('#lista').innerHTML = (ativas.length ? '<div class="grupo">Em andamento</div>' + ativas.map(item).join('') : '') +
    (outras.length ? '<div class="grupo">Paradas e concluídas</div>' + outras.map(item).join('') : '') || '<div class="vazio">Nenhuma missão.</div>'
  for (const b of document.querySelectorAll('[data-missao]')) b.onclick = () => { selecionada = b.dataset.missao; location.hash = selecionada; vivo.ref = null; vivo.seguir = true; atualizar() }
}

// ---------- detalhe ----------
const estadoTrilha = e => e === 'validado' ? 't-validado' : e === 'pendente' ? 't-pendente' : e === 'parou' ? 't-parou' : 't-andamento'
const rotuloAgente = c => c.tipo === 'revisao' ? 'revisão' : c.tipo === 'commit' ? 'commit' : c.tipo === 'ajuste' ? `ajuste ${c.rodada ?? ''}` : 'implementação'
function renderFeature(f, prefixo, padraoAberto) {
  const id = `${prefixo}:${f.execucao ?? ''}:${f.titulo}`
  const icone = SVG[f.estado] ?? SVG.pendente
  const direita = f.estado === 'feita' ? `<span class="mono sha">${f.commit ? esc(f.commit.slice(0, 7)) : '—'}</span>` : f.etapa ? selo('rodando', f.etapa) : f.estado === 'parou' ? selo('parou') : ''
  const meta = [num(f.rodadasAjuste) ? `${num(f.rodadasAjuste)} ajuste${num(f.rodadasAjuste) > 1 ? 's' : ''}` : '', num(f.quedas) ? `${num(f.quedas)} queda(s)` : '', f.duracaoMs ? duracao(f.duracaoMs) : ''].filter(Boolean).join(' · ')
  const probs = f.revisao?.problemas ?? []
  const dentro = [
    f.chamadas?.length ? `<div><div class="rotulo suave" style="margin-bottom:6px">Agentes · clique para ver ao vivo</div><div class="chips">${f.chamadas.map(c => `<button class="chip ${vivo.ref === c.ref ? 'on' : ''}" data-ref="${esc(c.ref)}" data-label="${esc(c.label)}">${esc(rotuloAgente(c))}</button>`).join('')}</div></div>` : '<div class="suave">Ainda não começou.</div>',
    probs.length ? `<div><div class="rotulo suave" style="margin-bottom:6px">Última revisão · ${f.revisao.aprovado ? 'aprovada' : `${probs.length} apontamento(s)`}</div>${probs.map(p => `<div class="apont"><span class="tag">${f.revisao.aprovado ? 'nota' : 'achado'}</span><span>${esc(p.problema ?? JSON.stringify(p))}</span></div>`).join('')}</div>` : f.revisao?.aprovado ? '<div>Revisão independente aprovada.</div>' : '',
    f.semCommitRegistrado ? '<div class="suave">Concluída sem commit registrado pela missão; o milestone foi validado.</div>' : '',
    f.motivoCommit && f.estado !== 'feita' ? `<div><div class="rotulo suave">Commit recusado</div><pre>${esc(f.motivoCommit)}</pre></div>` : '',
    f.resumo ? `<details class="bloco" data-id="${esc(`${id}:resumo`)}" ${aberto(`${id}:resumo`) ? 'open' : ''}><summary class="suave">Resumo do agente ▸</summary><pre style="margin-top:6px">${esc(f.resumo)}</pre></details>` : '',
  ].join('')
  return `<details class="feat" data-id="${esc(id)}" ${padraoAberto ? 'data-padrao="1"' : ''} ${aberto(id, padraoAberto) ? 'open' : ''}>
    <summary>${icone}<span class="t">${esc(curto(f.titulo))}</span><span class="meta">${esc(meta)}</span>${direita}</summary>
    <div class="dentro">${dentro}</div></details>`
}

function esqueleto(m) {
  $('#detalhe').dataset.missao = m.id
  $('#detalhe').innerHTML = `
    <section class="hero"><div class="esq"><div class="titulo"><h1 id="h-proj"></h1><span id="h-selo"></span><span class="mono suave" id="h-base"></span></div><div class="grande" id="h-grande"></div></div><div class="metricas" id="h-metricas"></div></section>
    <section aria-label="Milestones"><div class="trilha" id="trilha"></div><div class="legenda"><span><i style="background:var(--verde-f)"></i>validado</span><span><i style="background:var(--azul-f)"></i>em andamento</span><span><i style="background:var(--cartao);border:1px solid #2a313c"></i>pendente</span></div></section>
    <div class="grade"><div class="col"><div id="agora"></div>
      <section class="cartao vivo"><div class="cab"><div class="quem"><span class="rotulo" style="color:var(--azul)">Ao vivo</span><b id="vivo-quem">—</b></div><div style="display:flex;gap:8px"><button class="botao" id="vivo-tarefa">Tarefa</button><button class="botao on" id="vivo-seguir">Seguindo o atual</button></div></div><div class="feed" id="feed" aria-live="polite"></div></section>
      <div id="ms-atual"></div><div id="ms-lista"></div></div>
    <aside class="col"><section class="cartao"><div class="cab"><h2>Atividade</h2><span class="suave" style="font-size:12px">clique para ver ao vivo</span></div><div class="ativ" id="ativ"></div></section>
      <section class="cartao"><div class="cab"><h2>Commits</h2><span class="suave" style="font-size:12px" id="n-commits"></span></div><div class="commits" id="commits"></div></section>
      <section class="cartao"><details class="bloco" data-id="skills" ${aberto('skills') ? 'open' : ''}><summary class="cab" style="border-bottom:0"><h2>Skills da missão</h2><span class="suave" style="font-size:12px" id="n-skills"></span></summary><div id="skills"></div></details></section></aside></div>`
  $('#vivo-seguir').onclick = () => { vivo.seguir = !vivo.seguir; if (vivo.seguir && missaoAtual?.agora) abrirVivo(missaoAtual.agora.ref, missaoAtual.agora.label); pintarSeguir() }
  $('#vivo-tarefa').onclick = () => { vivo.mostrarTarefa = !vivo.mostrarTarefa; $('#vivo-tarefa').classList.toggle('on', vivo.mostrarTarefa); desenharFeed(false) }
  pintarSeguir()
  vivo.passos = []; vivo.total = 0; vivo.ref = null; vivo.geracao++
}

function renderDetalhe(m) {
  missaoAtual = m
  if (!$('#feed') || $('#detalhe').dataset.missao !== m.id) esqueleto(m)
  const pct = m.progresso.total ? Math.round(100 * m.progresso.feitas / m.progresso.total) : 0
  const decorrido = (m.estado === 'rodando' ? Date.now() : m.ultimaAtividade) - Date.parse(m.inicio)
  const porFeature = m.progresso.feitas ? decorrido / m.progresso.feitas : 0
  const faltam = m.progresso.total - m.progresso.feitas
  const estimativa = m.estado === 'concluida' ? { v: 'concluída', r: `em ${duracao(decorrido)}` }
    : porFeature && faltam ? { v: `≈ ${duracao(porFeature * faltam)}`, r: `restantes · ${duracao(porFeature)}/feature` } : { v: '—', r: 'estimativa após a 1ª feature' }

  $('#h-proj').textContent = m.projeto
  $('#h-selo').innerHTML = selo(m.estado)
  $('#h-base').textContent = `${m.branch ?? ''} · base ${(m.base ?? '').slice(0, 9)}`
  $('#h-grande').innerHTML = `${num(m.progresso.feitas)}<span> / ${num(m.progresso.total)}</span> <span style="font-size:15px;font-weight:400;letter-spacing:0;color:var(--suave)">features · ${pct}%</span>`
  $('#h-metricas').innerHTML = [
    { v: duracao(decorrido), r: `desde ${quando(m.inicio)}` }, estimativa,
    { v: String(num(m.agentes)), r: `agentes em ${m.execucoes.length} execução(ões)` }, { v: tokens(m.tokensSaida), r: `tokens gerados · ${tokens(m.tokens)} processados` },
  ].map(x => `<div class="metrica"><div class="v">${esc(x.v)}</div><div class="r">${esc(x.r)}</div></div>`).join('')
  $('#trilha').innerHTML = m.milestones.map(x => {
    const feitas = x.features.filter(f => f.estado === 'feita').length
    const id = x.suite ? 'Suíte' : (x.titulo.match(/^\S+/) ?? [x.titulo])[0]
    return `<div class="${estadoTrilha(x.estado)}" style="flex-grow:${Math.max(x.features.length, 2)}" title="${esc(x.titulo)}"><b>${esc(id)}</b><span>${x.features.length ? `${feitas}/${x.features.length}` : ''}</span></div>`
  }).join('')

  const f = m.featureAtual
  const legenda = p => p.estado === 'agora' ? 'em curso' : p.estado === 'feita' ? (p.vezes > 1 ? `feita · ${p.vezes} vezes` : 'feita') : p.estado === 'pulada' ? 'não precisou' : p.estado === 'parou' ? 'parou' : 'aguardando'
  $('#agora').innerHTML = m.estado === 'rodando' && f
    ? `<section class="agora"><div class="linha"><div><div class="rotulo" style="color:var(--azul)">Agora</div><div class="nome">${esc(curto(f.titulo))}</div></div><span class="suave" style="font-size:13px">${esc((f.milestone.match(/^\S+/) ?? [''])[0])} · há ${esc(ha(m.agora?.inicio))}</span></div>
      <ol class="etapas">${f.pipeline.map(p => `<li class="e-${CLASSES.has(p.estado) ? p.estado : 'pendente'}">${esc(p.nome)}<span>${esc(legenda(p))}</span></li>`).join('')}</ol></section>`
    : m.estado === 'rodando' ? `<section class="agora"><div class="rotulo" style="color:var(--azul)">Agora</div><div class="nome">${esc(m.atual ?? 'entre etapas')}</div></section>`
      : m.estado === 'parada' ? `<section class="agora parada"><div class="rotulo" style="color:var(--vermelho)">Parada</div><div>Último evento: ${esc(m.ultimoEvento?.label ?? '')}${m.ultimoEvento?.resumo ? ` — ${esc(m.ultimoEvento.resumo)}` : ''}. Sem atividade há ${esc(ha(m.ultimaAtividade))}.</div></section>`
        : '<section class="agora concluida"><div class="rotulo" style="color:var(--verde-t)">Missão concluída</div><div>Todas as features commitadas e a suíte final aprovada.</div></section>'

  const msAtual = m.milestones.find(x => !['validado', 'pendente'].includes(x.estado)) ?? null
  $('#ms-atual').innerHTML = msAtual ? `<section class="cartao"><div class="cab"><h2>${esc(curto(msAtual.titulo))}</h2><span class="suave" style="font-size:13px">${msAtual.features.filter(x => x.estado === 'feita').length} de ${msAtual.features.length}${num(msAtual.rodadasCorrecao) ? ` · ${num(msAtual.rodadasCorrecao)} rodada(s) de correção` : ''} · ${esc(NOMES[msAtual.estado] ?? msAtual.estado)}</span></div>
      ${msAtual.features.map(x => renderFeature(x, 'atual', x.estado === 'rodando')).join('')}
      ${msAtual.correcoes.length ? `<div class="cab" style="border-top:1px solid var(--linha)"><h2 style="font-size:13px">Correções</h2></div>${msAtual.correcoes.map(x => renderFeature(x, 'corr', x.estado === 'rodando')).join('')}` : ''}
      ${msAtual.validacoes.length ? `<div class="probs"><div class="chips">${msAtual.validacoes.slice(-4).map(v => selo(v.estado, `${v.label.split(':')[0]} · ${NOMES[v.estado] ?? v.estado}`)).join('')}</div>${(msAtual.problemasValidacao ?? []).map(p => `<div class="apont"><span class="tag">validação</span><span>${esc(p.problema ?? '')}</span></div>`).join('')}</div>` : ''}
    </section>` : ''
  const outros = m.milestones.filter(x => x !== msAtual)
  const iconeMs = e => SVG[e === 'validado' ? 'feita' : e === 'pendente' ? 'pendente' : e === 'parou' ? 'parou' : 'rodando']
  $('#ms-lista').innerHTML = `<section class="cartao"><div class="cab"><h2>Todos os milestones</h2><span class="suave" style="font-size:13px">${m.milestones.filter(x => x.estado === 'validado').length} validados</span></div>
    ${outros.map((x, i) => `<details class="ms" data-id="ms:${esc(x.titulo)}" ${aberto(`ms:${x.titulo}`) ? 'open' : ''}><summary>${iconeMs(x.estado)}<span class="t">${esc(curto(x.titulo))}</span><span class="suave" style="font-size:12px">${x.features.length ? `${x.features.filter(y => y.estado === 'feita').length}/${x.features.length}` : ''}</span></summary>
      ${x.features.map(y => renderFeature(y, `o${i}`, false)).join('')}${x.correcoes.map(y => renderFeature(y, `oc${i}`, false)).join('')}</details>`).join('')}</section>`

  const pontoCor = e => e === 'rodando' ? 'var(--azul)' : e === 'ok' ? 'var(--verde)' : e === 'caiu' || e === 'interrompido' ? 'var(--vermelho)' : 'var(--suave)'
  $('#ativ').innerHTML = m.linhaDoTempo.slice(0, 12).map(c => `<button data-ref="${esc(c.ref)}" data-label="${esc(c.label)}"><span class="ponto" style="background:${pontoCor(c.estado)}"></span><span class="txt"><b>${esc(curto(c.label))}</b><span>${esc(c.estado === 'rodando' ? 'rodando agora' : c.resumo ?? NOMES[c.estado] ?? '')}${c.duracaoMs ? ` · ${esc(duracao(c.duracaoMs))}` : ''}</span></span><span class="qdo">${esc(c.inicio ? ha(c.inicio) : '')}</span></button>`).join('')
  $('#commits').innerHTML = m.commits?.length ? m.commits.slice(0, 8).map(c => `<div><span class="mono" style="color:var(--azul)">${esc(c.sha)}</span><span title="${esc(c.assunto)}">${esc(c.assunto)}</span></div>`).join('') : '<div class="suave">Nenhum commit ainda.</div>'
  $('#n-commits').textContent = m.commits?.length ? `${m.commits.length} no intervalo` : ''
  $('#skills').innerHTML = m.skills.map(s => `<div class="skill"><details class="bloco" data-id="sk:${esc(s.nome)}" ${aberto(`sk:${s.nome}`) ? 'open' : ''}><summary><b style="font-weight:500">${esc(s.nome)}</b> <span class="suave" style="font-size:12px">· ${s.features.length} features</span></summary><pre>${esc(s.guia)}</pre></details></div>`).join('')
  $('#n-skills').textContent = String(m.skills.length)
  for (const b of document.querySelectorAll('#detalhe [data-ref]')) b.onclick = e => { e.preventDefault(); vivo.seguir = false; pintarSeguir(); abrirVivo(b.dataset.ref, b.dataset.label) }
  if (vivo.seguir && m.agora && m.agora.ref !== vivo.ref) abrirVivo(m.agora.ref, m.agora.label)
  else if (!vivo.ref && m.linhaDoTempo[0]) abrirVivo(m.linhaDoTempo[0].ref, m.linhaDoTempo[0].label)
}

// ---------- ao vivo ----------
const vivo = { geracao: 0, ref: null, label: '', passos: [], total: 0, seguir: true, mostrarTarefa: false, carregando: false }
function pintarSeguir() { const b = $('#vivo-seguir'); if (b) { b.classList.toggle('on', vivo.seguir); b.textContent = vivo.seguir ? 'Seguindo o atual' : 'Seguir o atual' } }
function abrirVivo(ref, label) {
  if (ref !== vivo.ref) { vivo.passos = []; vivo.total = 0; vivo.geracao++ }
  vivo.ref = ref; vivo.label = label
  const q = $('#vivo-quem'); if (q) q.textContent = curto(label)
  for (const c of document.querySelectorAll('.chip[data-ref]')) c.classList.toggle('on', c.dataset.ref === ref)
  desenharFeed(true)
  buscarPassos()
}
async function buscarPassos() {
  if (!vivo.ref || vivo.carregando) return
  vivo.carregando = true
  const ref = vivo.ref, geracao = vivo.geracao, desde = vivo.total
  try {
    const d = await (await fetch(`/api/passos/${ref}?desde=${desde}`)).json()
    // Troca de agente (mesmo voltando ao anterior) muda a geração: resposta antiga é descartada.
    if (geracao !== vivo.geracao || ref !== vivo.ref || desde !== vivo.total || !Array.isArray(d.passos)) return
    if (num(d.total) < vivo.total) { vivo.passos = []; vivo.total = 0; desenharFeed(true); return }
    if (d.passos.length) { vivo.passos.push(...d.passos); vivo.total = num(d.total); desenharFeed(false) }
  } catch {} finally { vivo.carregando = false }
}
function desenharFeed(forcarFim) {
  const feed = $('#feed'); if (!feed) return
  const noFim = forcarFim || feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60
  const resultados = new Map(vivo.passos.filter(p => p.tipo === 'resultado').map(p => [p.id, p]))
  const html = vivo.passos.map((p, i) => {
    if (p.tipo === 'tarefa') return vivo.mostrarTarefa ? `<div class="passo"><span class="ic">${SVG.tarefa}</span><div class="cont"><div class="lin"><b class="res">Tarefa recebida</b><span class="h">${esc(hora(p.quando))}</span></div><pre>${esc(p.texto)}</pre></div></div>` : ''
    if (p.tipo === 'texto') return `<div class="passo texto"><span class="ic">${SVG.outro}</span><div class="cont">${esc(p.texto)}</div></div>`
    if (p.tipo === 'pensou') return '<div class="passo pensou">pensou…</div>'
    if (p.tipo !== 'ferramenta') return ''
    const r = resultados.get(p.id)
    const [ic, cl] = tipoIcone(p.nome)
    const id = `p:${vivo.ref}:${i}`
    const saida = r ? `<div class="saida ${r.erro ? 'erro' : ''}">${esc((String(r.texto).split('\n').find(l => l.trim()) ?? '(sem saída)').slice(0, 200))}</div>` : '<div class="saida">rodando…</div>'
    const corpo = [p.detalhe && p.detalhe !== p.resumo ? `<pre>${esc(p.detalhe)}</pre>` : '', r ? `<pre${r.erro ? ' style="color:var(--vermelho)"' : ''}>${esc(r.texto || '(sem saída)')}</pre>` : ''].join('')
    return `<div class="passo"><span class="ic ${cl}">${SVG[ic]}</span><div class="cont"><details class="bloco" data-id="${esc(id)}" ${aberto(id) ? 'open' : ''}><summary><div class="lin"><span class="mono" style="color:var(--suave)">${esc(p.nome)}</span><span class="res">${esc(p.resumo ?? '')}</span><span class="h">${esc(hora(p.quando))}</span></div>${saida}</summary>${corpo}</details></div></div>`
  }).join('')
  feed.innerHTML = html || '<div class="suave" style="padding:20px">Sem passos ainda.</div>'
  if (noFim) feed.scrollTop = feed.scrollHeight
}

// ---------- ciclo ----------
async function atualizar() {
  fetch('/api/limites').then(r => r.json()).then(d => renderLimites(d.limites)).catch(() => {})
  try {
    const ms = await (await fetch('/api/missoes')).json()
    if (!selecionada || !ms.some(m => m.id === selecionada)) selecionada = (ms.find(m => m.estado === 'rodando') ?? ms[0])?.id ?? null
    renderLista(ms)
    if (selecionada) renderDetalhe(await (await fetch(`/api/missoes/${selecionada}`)).json())
    $('#atualizado').textContent = `atualizado ${new Date().toLocaleTimeString('pt-BR')}`
    $('#pulso').classList.remove('erro')
  } catch {
    $('#atualizado').textContent = 'sem conexão com o servidor do painel'
    $('#pulso').classList.add('erro')
  }
}
atualizar()
setInterval(atualizar, 5000)
setInterval(buscarPassos, 2000)
</script>
</body>
</html>
